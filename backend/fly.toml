# fly.toml app configuration file generated for mp-banking-final on 2026-05-10T18:47:26-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mp-banking-final'
primary_region = 'yyz'

[build]

[env]
  CORS_ALLOWED_ORIGINS = 'http://localhost:5173'
  DB_HOST = "mp-bank-db-final.internal"
  DB_NAME = 'bankdb'
  DB_PORT = '5433'
  ETRANSFER_EXPIRY_HOURS = '720'
  JAVA_OPTS = '-XX:MaxRAMPercentage=75 -XX:+UseG1GC'
  SPRING_PROFILES_ACTIVE = 'prod'

[[mounts]]
  source = 'statements'
  destination = '/app/statements'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/actuator/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
