spring:
  application:
    name: banking-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/bankdb
    username: bankuser
    password: bankpass
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  security:
      user:
        name: disabled
        password: disabled-not-used-jwt-only
  batch:
      job:
        enabled: false        # don't auto-run jobs at startup
      jdbc:
        initialize-schema: never   # we manage schema via Flyway

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      access: read_only
  info:
    git:
      mode: full
    env:
      enabled: true
  metrics:
    tags:
      application: banking-platform

info:
  app:
    name: Banking Platform
    description: Spring Boot + React simulated bank
    version: 0.7.0

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

app:
  security:
    jwt:
      secret: ${JWT_SECRET:LssbwaShINOR1UXKUf6PTE7mXMjv65BllAsYJ2FSasYjxMffoUbon7w2Gh4hNXDflX+QZFPA6RtYqOwlIeTZYw==}
      access-token-ttl-seconds: 900       
      refresh-token-ttl-seconds: 604800   
      issuer: banking-platform

bank:
  statements:
    dir: statements
  batch:
    statements:
      enabled: false                        # disabled by default in dev
      cron: "0 0 2 1 * *"                  # 02:00 on the 1st, monthly
  admin:
    boot-promote-email: frontend-test@example.com
  scheduled-transfers:
      runner:
        enabled: true                       # ON in dev; demo-friendly. Comment to disable.
        fixed-rate-ms: 300000              # 5 minutes
        initial-delay-ms: 30000            # wait 30s after boot before first run
  etransfer:
      expiry-hours: 1                 # demo-friendly: real Interac is 30 days (720 hours)
      expiry-runner:
        enabled: true                 # ON in dev so the demo works
        fixed-rate-ms: 60000          # check every minute (so demos see expiry quickly)
        initial-delay-ms: 30000

